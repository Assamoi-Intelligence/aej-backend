services:
  db:
    image: postgres:17-alpine
    container_name: postgres_database
    restart: always
    ports:
      - 5440:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: randompassword
      POSTGRES_DB: aej
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - aej
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: postgres_admin
    environment:
      PGADMIN_DEFAULT_EMAIL: intelligenceassamoi@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 5050:80
    depends_on:
      - db
    networks:
      - aej
  
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: aej-backend
    restart: always
    ports:
      - 3000:3000
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
    networks:
      - aej

networks:
  aej:

volumes:
  postgres:


